<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">

  <title>Frontend Mentor | Order summary card</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap');
  </style>
</head>

<body>
  <main>

    <img src="./images/illustration-hero.svg" alt="Illustration Hero" class="illustration-hero">

    <div class="summary-container">
      <h1 class="summary-title">Order Summary</h1>
      <p class="summary-description">
        You can now listen to millions of songs, audiobooks, and podcasts on any device
        anywhere you like!
      </p>
    </div>

    <div class="plan-container">
      <img src="./images/icon-music.svg" alt="Music Icon" class="plan-icon">
      <div class="plan-details">
        <p class="plan-name">Annual Plan</p>
        <p class="plan-price">$59.99/year</p>
      </div>
      <a href="#" class="change-link">Change</a>
    </div>
    
    <button class="proceed-button">Proceed to Payment</button>
    <button class="cancel-button">Cancel Order</button>

  </main>

  <footer>
    <div class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
      Coded by <a href="https://github.com/LuisGonzH94" target="_blank">LuisGonzH94</a>.
    </div>
  </footer>


</body>

</html>
